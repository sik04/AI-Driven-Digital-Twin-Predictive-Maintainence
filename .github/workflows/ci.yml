name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck & Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"

      - name: Ruff Format Check
        run: ruff format --check src tests scripts

      - name: Ruff Lint Check
        run: ruff check src tests scripts

      - name: Mypy Type Check
        run: mypy src tests

      - name: Run Pytest Suite (Core Synthetic Tests)
        run: pytest -m "not integration" --cov=src/intellitwin --cov-report=term-missing tests

  windows-artifacts:
    name: Windows Portability & Calibrator Loader (Python 3.11 on windows-latest)
    runs-on: windows-latest
    steps:
      - name: Configure Git LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,research]"

      - name: Run Windows Calibrator Loader and Portability Tests
        run: |
          pytest tests/test_step08_repair_and_step09_confirmatory.py -k "calibrator or portability or registry" -v

