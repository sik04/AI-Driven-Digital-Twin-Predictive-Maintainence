    title: "Robustness and Generalization"
    status: "locked"
    research_question: "Does the proposed method retain its calibration and maintenance-decision benefits across operating conditions, base RUL predictors, datasets, and repeated experimental runs?"
    null_hypothesis: "The observed benefits are specific to particular datasets, operating conditions, model families, or random seeds."
    alternative_hypothesis: "The principal reliability and maintenance-utility improvements persist across multiple operating conditions, model families, datasets, and repeated experimental runs."
    primary_scientific_purpose: "Verify that calibration and maintenance utility improvements generalize across varied architectures, datasets, and stochastic runs."
