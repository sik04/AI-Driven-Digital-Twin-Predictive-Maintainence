version: "step06-v2"
description: "Authoritative Hypothesis Registry and Numerical Evaluation Contract for IntelliTwin Prognostic Research"
last_updated: "2026-10-11"
status: "frozen"
approval_reference: "ADR-018"

governance_success_criteria_rule: "The old percentage-based thresholds (5%, 10%, 15%, 75%) are permanently superseded. Each RQ possesses a pre-specified primary metric, comparator set, frozen numerical practical-effect threshold, and cluster-bootstrap decision rule that classifies results as Supported, Unsupported, or Inconclusive under ADR-018."

metric_governance_rule: "Primary metrics determine the confirmatory claim for each research question. Supporting metrics provide scientific and operational safeguards but cannot replace the primary decision metric."

outcome_hierarchy_governance_rule: "The primary outcome determines the main conclusion for each research question. Secondary and supporting outcomes verify reliability constraints and trade-offs. A favorable secondary outcome cannot replace failure on the primary outcome. This hierarchy is frozen before confirmatory testing."

no_post_hoc_changes_rule: "Primary metrics, comparator sets, subgroup definitions, practical-effect thresholds, statistical decision rules, and outcome hierarchies are frozen and must not be altered after inspecting confirmatory results. Any deviation must be explicitly documented as an exploratory analysis."

threshold_governance_policy: "The previous percentage-cost-reduction rules (e.g., 5% cost improvement, 10% MPIW reduction) remain superseded. Numerical effect thresholds are frozen under ADR-018 as transparent benchmark preferences. They are study-defined acceptance criteria, not estimated airline economic constants or universal engineering limits, and must not be relaxed after observing test results."

numerical_evaluation_contract:
  protocol_version: "step06-v2"
  approval_reference: "ADR-018"
  primary_scenario: "primary_reference"
  primary_nominal_coverage: 0.90
  secondary_nominal_coverages: [0.80, 0.95]
  cost_improvement_margin_scu_per_engine: 0.20
  coverage_error_improvement_margin: 0.01
  maximum_absolute_coverage_error: 0.05
  mpiw_noninferiority_margin_cycles: 1.0
  interval_score_noninferiority_margin_cycles: 1.0
  robustness_cost_harm_margin_scu_per_engine: 0.20
  robustness_coverage_error_harm_margin: 0.01
  observed_failure_rate_increase_allowed: 0.0
  model_seeds: [2026, 2027, 2028, 2029, 2030]
  rationale:
    cost_improvement_margin: "0.20 SCU equals the economic cost of exactly one discarded usable operational cycle in the primary scenario (C_WASTE = 0.20). It represents the study-defined minimum interesting average cost improvement."
    coverage_error_margin: "0.01 coverage error represents exactly one percentage point deviation."
    maximum_absolute_coverage_error: "0.05 absolute error establishes a prespecified 85% to 95% empirical acceptance band around the 90% nominal coverage target."
    mpiw_noninferiority_margin: "1.0 cycle is the prespecified maximum acceptable increase in average MPIW."
    interval_score_noninferiority_margin: "1.0 cycle is the prespecified maximum acceptable increase in average Winkler interval score, assessed separately from MPIW."
    robustness_harm_margins: "The robustness non-harm margins (-0.20 SCU cost, -0.01 coverage error) match the primary improvement scales to rule out material cross-configuration deterioration."
    status_notice: "These are prespecified benchmark acceptance preferences. They are not derived from or justified by the deterministic validation pilot, nor empirically validated airline parameters."

statistical_uncertainty_framework:
  statistical_unit: "engine"
  comparison_structure: "Paired engine-level evaluation across identical splits, windows, and seeds."
  resample_count: 10000
  resampling_method: "Stratified engine-cluster bootstrap with replacement"
  stratification: "Dataset lifetime quartiles (Q1-Q4) preserved from frozen split manifests"
  prng_specification: "PCG64 with SeedSequence([2026, 6, dataset_number])"
  descriptive_confidence_level: "95% (quantiles 0.025, 0.975)"
  decision_confidence_level: "98.75% (quantiles 0.00625, 0.99375)"
  multiplicity_control: "Bonferroni FWER control across four RQs (0.05 / 4 = 0.0125 per RQ) combined with intersection-union testing across component conditions"
  window_independence_rule: "Individual cycles and windows are correlated measurements within an engine and must never be treated as independent observations."
  p_value_policy: "No supplementary p-value hypothesis tests form part of the confirmatory protocol."
  frozen_details_reference: "research/research_design/statistical_inference_protocol.md"

global_decision_rule: "An RQ is Supported if and only if every required component condition passes using the 98.75% decision intervals and observed failure safeguard; Unsupported if any required condition fails; and Inconclusive if any condition is indeterminate (e.g., CI overlaps the boundary) or degenerate."

research_problem: "Existing RUL research has separately studied conformal uncertainty calibration, condition/regime-aware calibration, and uncertainty-aware maintenance decision-making. What remains insufficiently established is a RUL-specific method that jointly adapts calibration to operating conditions and downstream sequential maintenance consequences while preserving reliable uncertainty coverage. Our study will therefore investigate whether decision-aware, condition-adaptive conformal calibration can improve maintenance utility without sacrificing subgroup reliability or merely becoming more conservative."

hypotheses:
  - id: "RQ1"
    title: "Sequential Maintenance Utility and Coverage Reliability"
    status: "frozen"
    approval_reference: "ADR-018"
    research_question: "Can a decision-aware, condition-adaptive conformal RUL calibration method improve sequential maintenance utility while preserving reliable prediction-interval coverage?"
    null_hypothesis: "The proposed method does not improve sequential maintenance utility by at least 0.20 SCU per engine over both global and standard condition-aware calibration, or fails to maintain required coverage reliability."
    alternative_hypothesis: "The proposed method improves maintenance utility by at least 0.20 SCU per engine over both global and standard condition-aware calibration while maintaining required coverage reliability."
    primary_scientific_purpose: "Evaluate whether decision-aware, condition-adaptive conformal calibration improves downstream sequential maintenance outcomes while maintaining target interval coverage."
    experiment_mapping: "Experiment A"
    primary_metric: "Total simulated maintenance cost per engine contrast (Delta_cost)"
    supporting_metrics:
      - "marginal absolute coverage error"
      - "worst-group operating regime coverage error"
      - "worst-group lifecycle stage coverage error"
      - "fleet failure rate"
    primary_comparator: "Global conformal calibration and standard condition-aware calibration"
    planned_comparators:
      - "Global conformal calibration"
      - "Standard condition-aware calibration"
    success_criteria:
      primary_metric: "Delta_cost (mean cost baseline - mean cost proposed in SCU per engine)"
      practical_effect_threshold: "0.20 SCU per engine"
      statistical_unit: "engine"
      decision_interval: "98.75% cluster-bootstrap percentile CI"
      eval_dataset: "FD002"
      cost_scenario: "primary_reference (C_PM=1.0, C_FAIL=5.0, C_WASTE=0.20)"
      nominal_coverage: 0.90
      required_models: ["GBR", "LSTM"]
      supported_rule: "For both GBR and LSTM, lower CI of Delta_cost > 0.20 SCU against both baselines, upper CI of marginal, worst-regime, and worst-stage coverage error < 0.05, and observed fleet failure rate increase <= 0.0 against both baselines."
      unsupported_rule: "For either model, upper CI of Delta_cost < 0.20 SCU against either baseline, lower CI of any coverage error > 0.05, or observed fleet failure rate increases over either baseline."
      inconclusive_rule: "No condition fails, but at least one decision interval covers its boundary, or inference is degenerate."

  - id: "RQ2"
    title: "Conditional Reliability and Interval Sharpness"
    status: "frozen"
    approval_reference: "ADR-018"
    research_question: "Can the proposed method improve reliability across operating regimes and degradation conditions without excessively widening prediction intervals?"
    null_hypothesis: "The proposed method does not improve worst-group conditional coverage error by at least 0.01 over both baselines, or causes interval width or interval score to deteriorate by 1.0 cycle or more."
    alternative_hypothesis: "The proposed method improves worst-group conditional coverage error by at least 0.01 over both baselines while restricting interval width and score deterioration to under 1.0 cycle."
    primary_scientific_purpose: "Audit subgroup reliability across operating regimes and wear stages to verify coverage safety without sacrificing interval efficiency."
    experiment_mapping: "Experiment B"
    primary_metric: "Worst-group conditional coverage error contrast (Delta_error)"
    supporting_metrics:
      - "Mean Prediction Interval Width contrast (D_width)"
      - "Winkler interval score contrast (D_score)"
      - "worst-group absolute coverage error"
    primary_comparator: "Global conformal calibration and standard condition-aware calibration"
    planned_comparators:
      - "Global conformal calibration"
      - "Standard condition-aware calibration"
    success_criteria:
      primary_metric: "Delta_error (worst-group error baseline - worst-group error proposed)"
      practical_effect_threshold: "0.01 (1 percentage point error reduction)"
      statistical_unit: "engine"
      decision_interval: "98.75% cluster-bootstrap percentile CI with conservative missing-group bound propagation"
      eval_dataset: "FD002"
      nominal_coverage: 0.90
      required_models: ["GBR", "LSTM"]
      required_families: ["operating_regimes (C1-C6)", "lifecycle_stages (Early/Mid/Late)"]
      supported_rule: "For both GBR and LSTM and across both subgroup families, lower CI of Delta_error > 0.01 against both baselines, upper CI of worst-group error < 0.05, upper CI of D_width < 1.0 cycle against both baselines, and upper CI of D_score < 1.0 cycle against both baselines."
      unsupported_rule: "For either model or subgroup family, upper CI of Delta_error < 0.01 against either baseline, lower CI of worst-group error > 0.05, lower CI of D_width > 1.0 cycle, or lower CI of D_score > 1.0 cycle."
      inconclusive_rule: "No condition fails, but at least one decision interval covers its boundary, or inference is degenerate."

  - id: "RQ3"
    title: "Decision-Value Attribution vs. Matched-Conservatism Controls"
    status: "frozen"
    approval_reference: "ADR-018"
    research_question: "Are the maintenance benefits of the proposed method attributable to decision-aware uncertainty calibration rather than simply more conservative prediction intervals or earlier maintenance?"
    null_hypothesis: "The proposed method does not improve maintenance utility by at least 0.20 SCU per engine over every prespecified matched-conservatism control family, or violates coverage constraints."
    alternative_hypothesis: "The proposed method improves maintenance utility by at least 0.20 SCU per engine over every prespecified matched-conservatism control family while preserving required coverage reliability."
    primary_scientific_purpose: "Disambiguate true decision-aware calibration utility from trivial interval expansion or naive early intervention."
    experiment_mapping: "Experiment C"
    primary_metric: "Maintenance cost improvement over matched-conservatism controls (Delta_cost)"
    supporting_metrics:
      - "wasted RUL"
      - "cost-inefficient early PM rate"
      - "coverage error"
    primary_comparator: "All three prespecified matched-conservatism control families"
    planned_comparators:
      - "Widened / matched-width prediction intervals"
      - "Tuned point-prediction safety margins"
      - "Earlier-intervention conservative policies"
    success_criteria:
      primary_metric: "Delta_cost (mean cost control - mean cost proposed in SCU per engine)"
      practical_effect_threshold: "0.20 SCU per engine against EVERY control family"
      statistical_unit: "engine"
      decision_interval: "98.75% cluster-bootstrap percentile CI"
      eval_dataset: "FD002"
      cost_scenario: "primary_reference"
      nominal_coverage: 0.90
      required_models: ["GBR", "LSTM"]
      supported_rule: "For both GBR and LSTM, lower CI of Delta_cost > 0.20 SCU against every prespecified control family, upper CI of marginal, worst-regime, and worst-stage coverage error < 0.05, and observed fleet failure rate increase <= 0.0 against all control families."
      unsupported_rule: "For either model, upper CI of Delta_cost < 0.20 SCU against any control family, lower CI of any coverage error > 0.05, or observed fleet failure rate increases over any control family."
      inconclusive_rule: "No condition fails, but at least one decision interval covers its boundary, or inference is degenerate."
      note: "Control tuning and matching will be specified in the later method-design step using development data only; confirmatory RQ3 evaluation cannot be run until that protocol is frozen."

  - id: "RQ4"
    title: "Robustness and Generalization"
    status: "frozen"
    approval_reference: "ADR-018"
    research_question: "Does the proposed method retain its calibration and maintenance-decision benefits across operating conditions, base RUL predictors, datasets, and repeated experimental runs?"
    null_hypothesis: "The proposed method fails to achieve aggregate improvements (Delta_cost > 0.20 SCU, Delta_error > 0.01) across the evaluation matrix, or exhibits material harm (Delta_cost < -0.20 SCU or Delta_error < -0.01) in any individual configuration cell."
    alternative_hypothesis: "The proposed method achieves aggregate improvements across the evaluation matrix without material harm in any individual configuration cell."
    primary_scientific_purpose: "Verify that calibration and maintenance utility improvements generalize across varied architectures, datasets, and stochastic runs."
    experiment_mapping: "Experiment D"
    primary_metric: "Weighted aggregate contrasts and cell-level non-harm bounds"
    supporting_metrics:
      - "individual cell effect sizes"
      - "cell-level decision intervals"
    primary_comparator: "Global conformal calibration and standard condition-aware calibration across 6 cells"
    planned_comparators:
      - "Global conformal calibration"
      - "Standard condition-aware calibration"
    success_criteria:
      evaluation_cells:
        - "FD001 x GBR"
        - "FD001 x LSTM"
        - "FD002 x GBR"
        - "FD002 x LSTM"
        - "FD004 x GBR"
        - "FD004 x LSTM"
      cell_weighting: "1/6 equal weight per cell in aggregate calculations"
      cost_scenario: "primary_reference"
      nominal_coverage: 0.90
      aggregate_thresholds:
        delta_cost: "0.20 SCU per engine"
        delta_error: "0.01 (1 percentage point)"
      cell_non_harm_thresholds:
        delta_cost: "-0.20 SCU per engine"
        delta_error: "-0.01 (1 percentage point)"
      decision_interval: "98.75% cluster-bootstrap percentile CI"
      supported_rule: "Against both baselines, lower CI of weighted aggregate Delta_cost > 0.20 SCU, lower CI of weighted aggregate Delta_error > 0.01 for regimes and stages, lower CI of Delta_cost > -0.20 SCU in every cell, lower CI of Delta_error > -0.01 in every cell, and cell-level coverage ceilings (< 0.05), interval safeguards (< 1.0 cycle), and failure safeguards hold across all 6 cells."
      unsupported_rule: "Upper CI of aggregate Delta_cost < 0.20 SCU or aggregate Delta_error < 0.01 against either baseline, or upper CI of Delta_cost < -0.20 SCU or Delta_error < -0.01 in any individual cell, or any cell-level safeguard fails."
      inconclusive_rule: "No condition fails, but at least one decision interval covers its boundary, or inference is degenerate."
